schema: spec-driven

context: |
  Escribir los artefactos en español, conservando en inglés los encabezados
  del formato OpenSpec (Requirement, Scenario, ADDED/MODIFIED/REMOVED) y las
  palabras clave SHALL/MUST.
  Servicio sin estado ni base de datos: recibe una solicitud de préstamo ya
  normalizada por n8n y devuelve una prioridad calculada por un motor de reglas
  determinístico. La IA nunca decide la prioridad.
  El contrato de POST /evaluar es fijo: n8n ya está construido y lo consume.
  Cambiarlo es un cambio incompatible, y debe declararse en la propuesta con
  los campos que entran y salen. El request no incluye datos personales
  identificables: solo session_id. Los campos extra se ignoran, sin fallar ni
  registrarse. edad y antiguedad_meses son requeridos.
  JSON en snake_case. Importes con BigDecimal, nunca double. Los números se
  aceptan como número JSON o como string numérico con formato decimal simple.
  Score = max(0, min(100, suma de puntos)). Si la solicitud es inelegible
  (menor de 18), la inelegibilidad reemplaza al recorte: prioridad BAJA y
  score 0, con un único motivo final. Los máximos por situación laboral están
  en la spec, por tabla, y no se normalizan a 100.
  Motivos en orden fijo: reglas excluyentes (con su resultado, también cuando
  pasan), después reglas de puntaje (urgencia, documentación, motivo,
  situación laboral, antigüedad, clearing, carga), y al final el motivo de
  recorte o de ajuste si corresponde. El score se reproduce sumando los
  motivos de puntaje.
  Reglas excluyentes y de puntaje son interfaces distintas (ReglaExcluyente y
  ReglaPuntaje). Cada regla es una clase. Puntajes y umbrales se configuran en
  application.yml y se validan al arrancar.
  Errores como ProblemDetail (RFC 9457) desde un único @RestControllerAdvice,
  con un type estable por caso y la lista de campos inválidos.
  El servicio se expone a internet: todo endpoint exige la clave de API
  (LEADS_API_KEY, variable de entorno; la app no arranca sin ella). No exponer
  springdoc ni actuator. Nunca registrar en logs el cuerpo de las solicitudes.
  Paquetes: primero por funcionalidad y después por capa. Sin persistencia.

rules:
  proposal:
    - "Incluir las secciones de la plantilla que falten: Change ID, Contratos afectados, Estrategia de testing y Aprobadores requeridos"
    - "En Decisiones confirmadas listar solo lo que una persona confirmó explícitamente; todo lo demás va como supuesto pendiente"
    - "Indicar siempre qué queda fuera de alcance"
    - "Todo cambio de contrato se declara en Contratos afectados, con los campos que entran y salen"
  specs:
    - "Cada requirement incluye al menos un escenario de error además del caso feliz"
    - "Cada escenario indica método HTTP, ruta y código de estado esperado"
    - "Cada regla de negocio es un requirement; los valores en el borde exacto de cada umbral y de cada límite de elegibilidad tienen su propio escenario"
    - "Las tablas de máximos por situación laboral se escriben completas, con el ajuste de clearing"
    - "Sin contradicciones ni términos ambiguos; cada término del dominio tiene un único significado"
  design:
    - "Listar los endpoints con request y response, y los type de error"
    - "Separar las reglas excluyentes (ReglaExcluyente) de las de puntaje (ReglaPuntaje)"
  tasks:
    - "Cada escenario de la spec tiene al menos una tarea de test que lo nombra exactamente"
    - "Un test verifica el orden completo de los motivos y que el motivo final aparece una sola vez"
    - "Terminar con las tareas de cierre: validate, revisión del código por una persona y archive como último commit"

operations:
  apply:
    guidance:
      - "Ejecutar ./mvnw test al terminar cada grupo de tareas; no marcar como completa una tarea con tests fallando"
      - "Si el comportamiento o el diseño deben cambiar, actualizar primero spec, design y tasks, y después el código"
      - "Al terminar cada grupo con tests en verde, proponer un commit que nombre el change-id y las tareas"
  archive:
    guidance:
      - "Confirmar que todos los tests pasan antes de archivar"